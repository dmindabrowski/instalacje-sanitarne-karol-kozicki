name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # Zbudowana strona do pobrania z zakładki Actions (do czasu podpięcia hostingu).
      - uses: actions/upload-artifact@v7
        with:
          name: strona-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          path: dist
          retention-days: 7
