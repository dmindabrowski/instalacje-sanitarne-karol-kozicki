<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo: Inżynieria Sanitarna Karol Kozicki</title>
<style>
	body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #0b0b0c; }
	section { display: flex; flex-wrap: wrap; align-items: center; gap: 48px; padding: 56px 48px; }
	.ciemne { background: #0b0b0c; color: #fff; }
	figure { margin: 0; }
	figcaption { margin-top: 12px; font-size: 12px; opacity: 0.6; }
</style>
</head>
<body>
	<section>
		<figure><img src="logo.svg" alt="" height="60"><figcaption>logo.svg, logo.png</figcaption></figure>
		<figure><img src="znak.svg" alt="" height="60"><figcaption>znak.svg, znak.png</figcaption></figure>
		<figure><img src="znak.svg" alt="" height="16"><figcaption>znak, 16 px</figcaption></figure>
	</section>
	<section class="ciemne">
		<figure><img src="logo-odwrocone.svg" alt="" height="60"><figcaption>logo-odwrocone.svg, logo-odwrocone.png</figcaption></figure>
		<figure><img src="znak-odwrocony.svg" alt="" height="60"><figcaption>znak-odwrocony.svg, znak-odwrocony.png</figcaption></figure>
		<figure><img src="znak-odwrocony.svg" alt="" height="16"><figcaption>znak, 16 px</figcaption></figure>
	</section>
</body>
</html>
